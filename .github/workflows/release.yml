name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag and source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_version="$(sed -n 's/^const pluginVersion = "\([^"]*\)"/\1/p' main.go)"
          registry_version="$(jq -r '.plugins[] | select(.id == "miora-provider") | .version' registry.json)"
          entry_version="$(jq -r '.version' registry-entry.json)"
          for item in "source:$source_version" "registry:$registry_version" "entry:$entry_version"; do
            if [ "${item#*:}" != "$version" ]; then
              echo "version mismatch ($item, tag:$version)" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install C toolchains and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gcc-mingw-w64-x86-64 binutils jq zip unzip

      - name: Test
        run: |
          go vet ./...
          go test ./...
          test -z "$(gofmt -l .)"

      - name: Build release archives
        env:
          CC_linux_amd64: gcc
          CC_windows_amd64: x86_64-w64-mingw32-gcc
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          for target in linux/amd64 windows/amd64; do
            goos="${target%%/*}"; goarch="${target##*/}"
            ext="so"; [ "$goos" = "windows" ] && ext="dll"
            out="release-assets/miora-provider.$ext"
            cc_var="CC_${goos}_${goarch}"
            CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" CC="${!cc_var}" \
              go build -trimpath -buildmode=c-shared -ldflags "-s -w" -o "$out" .
            zip -j "release-assets/miora-provider_${version}_${goos}_${goarch}.zip" "$out"
            rm -f "$out"
          done
          cd release-assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Verify archives and ABI
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd release-assets
          sha256sum -c checksums.txt
          unzip -p "miora-provider_${version}_linux_amd64.zip" miora-provider.so > /tmp/miora.so
          unzip -p "miora-provider_${version}_windows_amd64.zip" miora-provider.dll > /tmp/miora.dll
          for symbol in cliproxy_plugin_init cliproxyPluginCall cliproxyPluginFree cliproxyPluginShutdown; do
            nm -D --defined-only /tmp/miora.so | grep -Eq "[[:space:]]${symbol}$"
            x86_64-w64-mingw32-objdump -p /tmp/miora.dll | grep -Eq "[[:space:]]${symbol}$"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          assets=(
            "release-assets/miora-provider_${version}_linux_amd64.zip"
            "release-assets/miora-provider_${version}_windows_amd64.zip"
            "release-assets/checksums.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            notes=(--generate-notes)
            if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
              notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
            fi
            # --draft=false is explicit: the default has produced draft releases here,
            # and a draft release has no public asset URLs for the plugin store.
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft=false --latest \
              --title "$RELEASE_TAG" "${notes[@]}"
          fi
